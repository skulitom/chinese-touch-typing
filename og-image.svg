<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#14171f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="240" r="320" fill="url(#glow)"/>

  <!-- Big hanzi -->
  <text x="600" y="320" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif"
        font-size="240" font-weight="500" text-anchor="middle" fill="#e6e9ef">中文</text>

  <!-- Title -->
  <text x="600" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="52" font-weight="600" text-anchor="middle" fill="#5eead4"
        letter-spacing="2">Touch Typing</text>

  <!-- Subtitle -->
  <text x="600" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="22" font-weight="400" text-anchor="middle" fill="#7a8294"
        letter-spacing="1">Learn Mandarin pinyin · 644 characters · 226 radicals</text>

  <!-- Bottom accent line -->
  <rect x="540" y="520" width="120" height="3" rx="2" fill="#ffb84d"/>

  <!-- Tiny URL footer -->
  <text x="600" y="580" font-family="ui-monospace,Menlo,Consolas,monospace"
        font-size="16" text-anchor="middle" fill="#4d5563">
    skulitom.github.io/chinese-touch-typing
  </text>
</svg>
