<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中文 Touch Typing</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14171f;
    --panel-2: #1c212c;
    --panel-3: #242a36;
    --text: #e6e9ef;
    --muted: #7a8294;
    --dim: #3e4555;
    --accent: #5eead4;
    --accent-glow: rgba(94, 234, 212, 0.12);
    --target: #ffb84d;
    --target-glow: rgba(255, 184, 77, 0.16);
    --correct: #3ddc84;
    --correct-glow: rgba(61, 220, 132, 0.20);
    --wrong: #ff5a5a;
    --wrong-glow: rgba(255, 90, 90, 0.20);
    --border: #262c39;
    --tone1: #e74c3c;
    --tone2: #f39c12;
    --tone3: #2ecc71;
    --tone4: #3498db;
    --tone5: #95a5a6;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel) 0%, rgba(20,23,31,0.6) 100%);
    backdrop-filter: blur(8px);
  }
  .title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .title-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: dot-pulse 2s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .stats {
    display: flex;
    gap: 32px;
  }
  .icon-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    padding: 0;
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .icon-btn.muted {
    color: var(--wrong);
    border-color: rgba(255, 90, 90, 0.4);
  }
  .icon-btn.chill-active {
    color: #ffd166;
    border-color: rgba(255, 209, 102, 0.55);
    background: rgba(255, 209, 102, 0.08);
  }
  .icon-btn.chill-only { display: none; }
  body.chill-mode .icon-btn.chill-only { display: flex; }
  .icon-btn.text-btn {
    font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
    font-size: 16px;
    font-weight: 500;
  }
  .icon-btn.traditional-active {
    color: var(--accent);
    border-color: rgba(94, 234, 212, 0.55);
    background: rgba(94, 234, 212, 0.08);
  }
  body.chill-mode .stage-dots,
  body.chill-mode .stat-mastered {
    opacity: 0.35;
  }
  body.chill-mode .title-dot {
    background: #ffd166;
  }
  .icon-btn svg {
    width: 18px;
    height: 18px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    min-width: 56px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: color 0.2s;
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.flash-up { color: var(--correct); }
  .stat-value.flash-down { color: var(--wrong); }
  .stat-value .stat-total {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    margin-left: 1px;
  }
  .stat-value.mastered-val {
    color: var(--text);
  }
  .stat-value.mastered-val.flash-gold {
    color: #ffd166;
    transition: color 0.2s;
  }
  .curriculum-select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    padding: 0 14px 0 0;
    margin: 0;
    text-align: right;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' viewBox='0 0 24 24' fill='none' stroke='%237a8294' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right center;
    background-size: 8px;
    transition: color 0.12s;
  }
  .curriculum-select:hover,
  .curriculum-select:focus {
    color: var(--text);
    outline: none;
  }
  .curriculum-select option {
    background: var(--panel);
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-size: 13px;
    font-weight: 400;
  }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 32px 24px 28px;
    gap: 24px;
    overflow: hidden;
  }
  .play-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    width: 100%;
  }

  .character {
    font-size: clamp(7rem, 18vh, 13rem);
    line-height: 1;
    font-weight: 400;
    color: var(--text);
    transition: color 0.18s, transform 0.18s;
    font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
    cursor: pointer;
  }
  .character:hover {
    color: var(--accent);
  }
  .character.correct {
    color: var(--correct);
    animation: pop 0.32s ease-out;
  }
  .character.wrong {
    animation: shake 0.32s ease-in-out;
    color: var(--wrong);
  }
  .character.mastered-flash {
    color: #ffd166 !important;
    animation: mastered-pop 0.7s ease-out;
  }
  @keyframes mastered-pop {
    0% { transform: scale(1); }
    25% { transform: scale(1.14); }
    60% { transform: scale(0.97); }
    100% { transform: scale(1); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }

  .pinyin {
    font-size: clamp(2rem, 5vh, 3.2rem);
    font-weight: 300;
    display: flex;
    gap: 0.25rem;
    letter-spacing: 0.05em;
    height: 1.2em;
    align-items: center;
  }
  .pinyin .letter {
    transition: color 0.12s, text-shadow 0.12s, transform 0.12s;
    color: var(--dim);
    min-width: 0.55em;
    text-align: center;
    position: relative;
    font-feature-settings: "tnum";
  }
  .pinyin .letter.done {
    color: var(--correct);
  }
  .pinyin .letter.current {
    color: var(--tone-color, var(--target));
    transform: translateY(-2px);
  }
  .pinyin .space {
    width: 0.4em;
  }

  .translation {
    font-size: 0.95rem;
    color: var(--muted);
    letter-spacing: 0.4px;
    text-align: center;
    max-width: 640px;
    min-height: 1.4em;
    line-height: 1.4;
    font-style: italic;
    padding: 0 16px;
    transition: opacity 0.2s;
  }
  .play-area.hide-translation .translation { visibility: hidden; }
  .pinyin .letter.hidden-letter {
    color: var(--dim);
    opacity: 0.5;
  }
  .pinyin .letter.hidden-letter.current {
    color: var(--tone-color, var(--target));
    opacity: 0.75;
  }

  .stage-dots {
    display: flex;
    gap: 6px;
    height: 8px;
    align-items: center;
    opacity: 0.85;
  }
  .stage-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--panel-3);
    border: 1px solid var(--border);
    transition: background 0.2s, border-color 0.2s;
  }
  .stage-dots .dot.filled {
    background: var(--accent);
    border-color: var(--accent);
  }
  .stage-dots.is-mastered .dot {
    background: #ffd166;
    border-color: #ffd166;
  }

  .progress-wrap {
    width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .progress {
    width: 100%;
    height: 3px;
    background: var(--panel-2);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--target) 100%);
    transition: width 0.12s ease-out;
    width: 0%;
  }

  /* ---------- Keyboard ---------- */
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 18px 22px;
    background: var(--panel);
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .kb-row {
    display: flex;
    gap: 7px;
    justify-content: center;
  }
  .kb-row.r2 { padding-left: 26px; }
  .kb-row.r3 { padding-left: 60px; }

  .key {
    width: 54px;
    height: 54px;
    border-radius: 9px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    transition: background 0.06s, color 0.06s, border-color 0.06s, transform 0.05s, box-shadow 0.12s;
    position: relative;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .key.dim { color: var(--dim); }
  .key.expected {
    background: var(--panel-3);
    color: var(--target);
    border-color: var(--target);
    animation: pulse-target 1.6s ease-in-out infinite;
  }
  @keyframes pulse-target {
    0%, 100% { border-color: var(--target); }
    50% { border-color: rgba(255, 184, 77, 0.55); }
  }
  .key.pressed {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    transform: translateY(2px);
    animation: none;
  }
  .key.correct-flash {
    background: var(--correct) !important;
    color: var(--bg) !important;
    border-color: var(--correct) !important;
    animation: none !important;
  }
  .key.wrong-flash {
    background: var(--wrong) !important;
    color: var(--bg) !important;
    border-color: var(--wrong) !important;
    animation: shake-key 0.25s ease-in-out !important;
  }
  @keyframes shake-key {
    0%, 100% { transform: translateX(0); }
    33% { transform: translateX(-3px); }
    66% { transform: translateX(3px); }
  }

  /* Footer hint */
  .footer-hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    pointer-events: none;
  }
  .footer-hint kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 10px;
    color: var(--muted);
    margin: 0 2px;
  }

  /* Tone color classes for pinyin */
  .tone-1 { --tone-color: var(--tone1); --tone-glow: rgba(231, 76, 60, 0.4); }
  .tone-2 { --tone-color: var(--tone2); --tone-glow: rgba(243, 156, 18, 0.4); }
  .tone-3 { --tone-color: var(--tone3); --tone-glow: rgba(46, 204, 113, 0.4); }
  .tone-4 { --tone-color: var(--tone4); --tone-glow: rgba(52, 152, 219, 0.4); }
  .tone-5 { --tone-color: var(--tone5); --tone-glow: rgba(149, 165, 166, 0.3); }

  /* ---------- Achievements ---------- */
  .achievements {
    position: fixed;
    right: 14px;
    top: 86px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
    pointer-events: none;
  }
  .achievement {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    pointer-events: auto;
    position: relative;
    transition: transform 0.18s, border-color 0.18s, background 0.18s;
    cursor: help;
  }
  .achievement:hover {
    transform: scale(1.1);
    border-color: var(--accent);
    background: var(--panel-3);
  }
  .achievement .tooltip {
    position: absolute;
    right: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%) translateX(6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.16s, transform 0.16s, visibility 0s linear 0.16s;
    pointer-events: none;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  .achievement:hover .tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) translateX(0);
    transition: opacity 0.16s, transform 0.16s;
  }
  .achievement .tooltip strong {
    display: block;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .achievement .tooltip .desc {
    color: var(--muted);
    font-weight: 400;
  }
  .achievement.just-unlocked {
    animation: ach-pop 0.7s ease-out;
    border-color: var(--accent);
  }
  @keyframes ach-pop {
    0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
    55%  { transform: scale(1.35) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .achievement-toast {
    position: fixed;
    top: 78px;
    left: 50%;
    transform: translateX(-50%) translateY(-16px);
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.28s, transform 0.28s;
    z-index: 100;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    max-width: 360px;
    pointer-events: none;
  }
  .achievement-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .achievement-toast .icon {
    font-size: 28px;
    line-height: 1;
  }
  .achievement-toast .label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }
  .achievement-toast .title {
    font-weight: 600;
    color: var(--accent);
    font-size: 14px;
    margin-top: 1px;
  }
  .achievement-toast .desc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  @media (max-width: 720px) {
    .stats { gap: 18px; }
    .stat-value { font-size: 18px; }
    .key { width: 32px; height: 40px; font-size: 12px; }
    .kb-row.r2 { padding-left: 16px; }
    .kb-row.r3 { padding-left: 32px; }
    .achievements { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="title"><span class="title-dot"></span><span id="titleText">中文 · Touch Typing</span></div>
    <div class="header-controls">
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span id="score" class="stat-value accent">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">CPM</span>
          <span id="cpm" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Accuracy</span>
          <span id="accuracy" class="stat-value">100%</span>
        </div>
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span id="streak" class="stat-value">0</span>
        </div>
        <div class="stat stat-mastered" title="Mastered characters in the selected curriculum">
          <select id="curriculumSelect" class="stat-label curriculum-select" aria-label="Curriculum"></select>
          <span id="mastered" class="stat-value mastered-val">0<span class="stat-total"> / 0</span></span>
        </div>
      </div>
      <button id="chillBtn" class="icon-btn" aria-label="Toggle chill mode" title="Chill mode — no pressure, all hints"></button>
      <button id="hidePinyinBtn" class="icon-btn chill-only" aria-label="Toggle pinyin visibility" title="Hide pinyin in chill mode"></button>
      <button id="traditionalBtn" class="icon-btn text-btn" aria-label="Toggle simplified/traditional" title="Switch to Traditional Chinese">繁</button>
      <button id="muteBtn"  class="icon-btn" aria-label="Toggle sound" title="Toggle sound (`)"></button>
    </div>
  </header>

  <main>
    <div id="playArea" class="play-area">
      <div id="character" class="character" title="Click to replay sound (Space)">·</div>
      <div id="pinyin" class="pinyin"></div>
      <div id="translation" class="translation"></div>
      <div id="stageDots" class="stage-dots" aria-hidden="true"></div>
      <div class="progress-wrap">
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
      </div>
    </div>
    <div id="keyboard" class="keyboard"></div>
  </main>

  <aside id="achievements" class="achievements" aria-label="Achievements"></aside>

  <div class="footer-hint">type the pinyin · <kbd>Space</kbd> replay · <kbd>`</kbd> mute · <kbd>Esc</kbd> reset session · <kbd>Shift+Esc</kbd> clear progress</div>

<script>
// ===================== Dictionary =====================

// The pinyin-with-tones must have the same character count as the typed form
// (since tones are diacritics on existing vowels). ü is written as 'v' in typed form
// (matching the standard pinyin IME convention).

function parseDict(raw) {
  const out = [];
  const seen = new Set();
  raw.trim().split('\n').forEach(rawLine => {
    const line = rawLine.trim();
    if (!line) return;
    const pipeIdx = line.indexOf('|');
    const prefix = pipeIdx >= 0 ? line.slice(0, pipeIdx).trim() : line;
    const en     = pipeIdx >= 0 ? line.slice(pipeIdx + 1).trim() : '';
    const parts = prefix.split(/\s+/);
    if (parts.length < 3) return;
    const [h, p, t] = parts;
    if (seen.has(h)) return; // dedupe
    seen.add(h);
    if ([...p].length !== [...t].length) {
      console.warn('Pinyin/typed length mismatch', h, p, t);
    }
    out.push({ h, p, t: t.toLowerCase(), en });
  });
  return out;
}

const DICT = parseDict(DICT_RAW);
const DICT_BY_H = new Map(DICT.map(d => [d.h, d]));
const TOTAL_CHARS = DICT.length;

// ===================== Mastery system =====================
// Each character has a `progress` score that goes up on a clean (zero-mistake)
// completion and down when an attempt contained any mistake. Each progress
// step strips one specific helper, in this order:
//
//   p0                       full help: pinyin + kbd-key hint + sound + translation
//   p1                       kbd-key hint removed
//   p2                       sound auto-play removed  ← important: sound IS the pinyin,
//                                                       so it must be gone before
//                                                       letter-hiding has any bite
//   p3..(2+pinyinLen)        pinyin letters hidden one at a time, from the end
//   p(3+pinyinLen)           translation removed (kept until close to the end since
//                                                  it's contextual, not a typing hint)
//   p(4+pinyinLen)           = mastered
//
// Since mastery depth scales with pinyin length, longer-pinyin characters need
// a couple more clean runs to master — which matches how they really are harder.
const ACTIVE_POOL_SIZE = 10;       // how many unmastered chars are "in rotation"
const MASTERED_REVIEW_PROB = 0.08; // chance to insert a mastered review

function getHelpers(progress, pinyinLen) {
  const p = progress || 0;
  let lettersHidden = 0;
  if (p >= 3) lettersHidden = Math.min(p - 2, pinyinLen);
  return {
    lettersHidden,
    showKbdHint:     p < 1,
    autoSound:       p < 2,
    showTranslation: p < pinyinLen + 3,
  };
}
function getMasteryAt(pinyinLen) {
  return pinyinLen + 4;
}
function isMastered(stats, hanzi) {
  if (!stats) return false;
  const entry = DICT_BY_H.get(hanzi);
  const len = entry ? entry.t.length : 3;
  return (stats.progress || 0) >= getMasteryAt(len);
}
function emptyStats() {
  return { attempts: 0, errors: 0, mistakesThisAttempt: 0, progress: 0, everMastered: false };
}

// ===================== Persistence =====================
const STORAGE_KEY = 'ct-perchar-v2';
function loadPerChar() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return new Map();
    const obj = JSON.parse(raw);
    const m = new Map();
    Object.entries(obj).forEach(([k, v]) => m.set(k, { ...emptyStats(), ...v, mistakesThisAttempt: 0 }));
    return m;
  } catch {
    return new Map();
  }
}
function savePerChar() {
  const obj = {};
  state.perChar.forEach((v, k) => {
    const { mistakesThisAttempt, ...rest } = v;
    obj[k] = rest;
  });
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch {}
}

    if (!raw) return new Map();
    return new Map(Object.entries(JSON.parse(raw)));
  } catch { return new Map(); }
}
function saveAchievements() {
  const obj = {};
  state.achievements.forEach((v, k) => obj[k] = v);
  try { localStorage.setItem(ACH_KEY, JSON.stringify(obj)); } catch {}
}
function loadLifetime() {
  try {
    const raw = localStorage.getItem(LIFE_KEY);
    if (!raw) return { totalChars: 0 };
    return { totalChars: 0, ...JSON.parse(raw) };
  } catch { return { totalChars: 0 }; }

}

function getCurrentCPM() {
  if (!state.startTime) return 0;
  const minutes = (Date.now() - state.startTime) / 60000;
  return minutes > 0 ? Math.round(state.charsCompleted / minutes) : 0;
}

function unlockAchievement(id, silent = false) {
  if (state.achievements.has(id)) return;
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (!a) return;
  state.achievements.set(id, { at: Date.now() });
  saveAchievements();
  renderAchievementsSidebar(silent ? null : id);
  if (!silent) showAchievementToast(a);
}
function checkPassiveAchievements(silent = false) {
  for (const a of ACHIEVEMENTS) {
    if (state.achievements.has(a.id)) continue;
    if (typeof a.check === 'function') {
      let ok = false;
      try { ok = !!a.check(); } catch {}
      if (ok) unlockAchievement(a.id, silent);
    }
  }
}

function renderAchievementsSidebar(highlightId) {
  const sidebar = document.getElementById('achievements');
  if (!sidebar) return;
  sidebar.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    if (!state.achievements.has(a.id)) return;
    const el = document.createElement('div');
    el.className = 'achievement';
    if (a.id === highlightId) el.classList.add('just-unlocked');
    el.innerHTML =
      '<span aria-hidden="true">' + a.icon + '</span>' +
      '<span class="tooltip"><strong>' + a.title + '</strong>' +
      '<span class="desc">' + a.desc + '</span></span>';
    sidebar.appendChild(el);
    if (a.id === highlightId) {
      setTimeout(() => el.classList.remove('just-unlocked'), 800);
    }
  });
}

let _toastTimer = null;
function showAchievementToast(a) {
  // Replace any existing toast — newest takes the stage
  document.querySelectorAll('.achievement-toast').forEach(n => n.remove());
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  const toast = document.createElement('div');
  toast.className = 'achievement-toast';
  toast.innerHTML =
    '<div class="icon">' + a.icon + '</div>' +
    '<div class="text">' +
      '<div class="label">Achievement</div>' +
      '<div class="title">' + a.title + '</div>' +
      '<div class="desc">' + a.desc + '</div>' +
    '</div>';
  document.body.appendChild(toast);
  // double rAF so the transition kicks in
  requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('show')));
  _toastTimer = setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 350);
    _toastTimer = null;
  }, 3200);
}

// ===================== Tone detection =====================
const TONE_VOWELS = {
  1: 'āēīōūǖ',
  2: 'áéíóúǘ',
  3: 'ǎěǐǒǔǚ',
  4: 'àèìòùǜ'
};
function detectTone(pinyin) {
  for (const t of [1,2,3,4]) {
    for (const ch of pinyin) {
      if (TONE_VOWELS[t].includes(ch)) return t;
    }
  }
  return 5;
}

// ===================== Speech (Web Speech API) =====================
const TTS_SUPPORTED = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let chineseVoice = null;
function loadChineseVoice() {
  if (!TTS_SUPPORTED) return;
  const voices = speechSynthesis.getVoices();
  chineseVoice =
       voices.find(v => /^zh-CN/i.test(v.lang))
    || voices.find(v => /^zh-Hans/i.test(v.lang))
    || voices.find(v => /^zh/i.test(v.lang))
    || null;
}
if (TTS_SUPPORTED) {
  loadChineseVoice();
  if (!chineseVoice && typeof speechSynthesis.onvoiceschanged !== 'undefined') {
    speechSynthesis.onvoiceschanged = loadChineseVoice;
  }
}
function speak(text) {
  if (state.muted || !TTS_SUPPORTED) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (chineseVoice) u.voice = chineseVoice;
    u.rate = 0.85;
    u.pitch = 1.0;
    speechSynthesis.speak(u);
  } catch (e) {
    /* ignore TTS errors */
  }
}

// ===================== Selection (adaptive) =====================
function pickNext() {
  const corpus = getCurriculumChars();

  // Chill mode: uniform random over the current curriculum, with the same
  // short avoid-list to prevent immediate repeats.
  if (state.chillMode) {
    const avoid = new Set(state.recentChars.slice(-4));
    let pool = corpus.filter(d => !avoid.has(d.h));
    if (pool.length === 0) pool = corpus.length ? corpus : DICT;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // Curriculum model: at any moment the user is working on a small "active pool"
  // of up to ACTIVE_POOL_SIZE unmastered characters drawn from the selected
  // curriculum. The pool is the union of:
  //   1. every character in the curriculum the user has started but not mastered,
  //   2. enough fresh (never-attempted) curriculum characters to top the pool up.
  // As characters master, they leave the pool and the next fresh one slides in.
  const inProgress = corpus.filter(d => {
    const s = state.perChar.get(d.h);
    return s && s.attempts > 0 && !isMastered(s, d.h);
  });
  const fresh = corpus.filter(d => {
    const s = state.perChar.get(d.h);
    return !s || s.attempts === 0;
  });
  const slotsLeft = Math.max(0, ACTIVE_POOL_SIZE - inProgress.length);
  const active = inProgress.concat(fresh.slice(0, slotsLeft));

  const avoid = new Set(state.recentChars.slice(-4));

  // Small probability to surface a previously-mastered character (from the
  // current curriculum) for a quick retention check.
  const masteredPool = corpus.filter(d => isMastered(state.perChar.get(d.h), d.h) && !avoid.has(d.h));
  if (masteredPool.length > 0 && active.length > 0 && Math.random() < MASTERED_REVIEW_PROB) {
    return masteredPool[Math.floor(Math.random() * masteredPool.length)];
  }

  // Pick from the active pool, avoiding recent repeats.
  let pool = active.filter(d => !avoid.has(d.h));
  if (pool.length === 0) pool = active;
  if (pool.length === 0) {
    // Whole curriculum mastered — fall back to a mastered-pool review.
    if (masteredPool.length > 0) {
      return masteredPool[Math.floor(Math.random() * masteredPool.length)];
    }
    return corpus[0] || DICT[0];
  }

  const weights = pool.map(d => {
    const s = state.perChar.get(d.h);
    if (!s || s.attempts === 0) return 1.5;            // brand-new chars come up a bit more
    const errRate = s.errors / Math.max(1, s.attempts);
    const progressBoost = (s.progress || 0) * 0.06;    // gentle nudge for near-mastery
    return 1 + errRate * 2 + progressBoost;
  });
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

// ===================== Rendering =====================
const $char = document.getElementById('character');
const $pinyin = document.getElementById('pinyin');
const $translation = document.getElementById('translation');
const $progress = document.getElementById('progressBar');
const $score = document.getElementById('score');
const $cpm = document.getElementById('cpm');
const $accuracy = document.getElementById('accuracy');
const $streak = document.getElementById('streak');
const $kb = document.getElementById('keyboard');
const $muteBtn = document.getElementById('muteBtn');
const $playArea = document.getElementById('playArea');
const $mastered = document.getElementById('mastered');
const $stageDots = document.getElementById('stageDots');
const $curriculumSelect = document.getElementById('curriculumSelect');

function buildCurriculumOptions() {
  if (!$curriculumSelect) return;
  $curriculumSelect.innerHTML = '';
  CURRICULA.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    const size = c.hanzi ? c.hanzi.length : (c.size || DICT.length);
    opt.textContent = c.label + ' (' + size + ')';
    if (state.curriculum === c.id) opt.selected = true;
    $curriculumSelect.appendChild(opt);
  });
}
function onCurriculumChange() {
  state.curriculum = $curriculumSelect.value;
  localStorage.setItem('ct-curriculum', state.curriculum);
  updateMasteredDisplay();
  // Clear typing state and pick a character from the new curriculum.
  state.typedIndex = 0;
  state.awaitingAdvance = false;
  state.recentChars = [];
  nextCharacter();
  updateStatsDisplay();
}

function updateMasteredDisplay(opts = {}) {
  const n = countMastered();
  $mastered.innerHTML = n + '<span class="stat-total"> / ' + getCurriculumTotal() + '</span>';
  if (opts.gold) {
    $mastered.classList.add('flash-gold');
    setTimeout(() => $mastered.classList.remove('flash-gold'), 900);
  }
}

function renderStageDots(helpers, pinyinLen, mastered) {
  // 4 dots — one per helper layer. Each fills as that layer is removed,
  // so the dots act as a "what's hiding next" indicator. All gold once
  // the character is mastered.
  //   1: keyboard "next key" hint removed
  //   2: sound auto-play removed
  //   3: pinyin letters fully hidden
  //   4: translation removed
  $stageDots.innerHTML = '';
  $stageDots.classList.toggle('is-mastered', !!mastered);
  const layers = [
    !helpers.showKbdHint,
    !helpers.autoSound,
    helpers.lettersHidden >= pinyinLen,
    !helpers.showTranslation,
  ];
  layers.forEach(filled => {
    const d = document.createElement('div');
    d.className = 'dot' + (filled || mastered ? ' filled' : '');
    $stageDots.appendChild(d);
  });
}

function updateMuteUI() {
  $muteBtn.classList.toggle('muted', state.muted);
  $muteBtn.innerHTML = state.muted ? ICON_MUTED : ICON_SPEAKER;
  $muteBtn.title = state.muted ? 'Unmute (`)' : 'Mute (`)';
}
function toggleMute() {
  state.muted = !state.muted;
  localStorage.setItem('ct-muted', state.muted ? '1' : '0');
  if (state.muted && TTS_SUPPORTED) speechSynthesis.cancel();
  updateMuteUI();
  if (!state.muted && state.current) speak(state.current.h);
}
function replayCurrent() {
  if (!state.current) return;
  // If muted, briefly unmute-feel: don't change the persisted mute state,
  // just force-play this single utterance.
  if (state.muted) {
    // honor mute — do nothing
    return;
  }
  speak(state.current.h);
}

// ===================== Chill mode =====================
// Chill mode = pressure-free exposure practice. All hints are always on,
// characters are picked uniformly at random from the entire dictionary,
// and nothing about a character's mastery / errors / lifetime is updated
// while you practice. Toggle persists across sessions.
const ICON_CHILL   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const ICON_EYE     = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const $chillBtn = document.getElementById('chillBtn');
const $hidePinyinBtn = document.getElementById('hidePinyinBtn');
const $titleText = document.getElementById('titleText');

function chillHelpers(pinyinLen) {
  return {
    lettersHidden: state.hidePinyinInChill ? pinyinLen : 0,
    showKbdHint: true,
    autoSound: true,
    showTranslation: true,
  };
}
function updateChillUI() {
  if ($chillBtn) {
    $chillBtn.classList.toggle('chill-active', state.chillMode);
    $chillBtn.innerHTML = ICON_CHILL;
    $chillBtn.title = state.chillMode
      ? 'Chill mode ON — click to switch to mastery practice'
      : 'Chill mode OFF — click for pressure-free practice';
  }
  if ($titleText) {
    $titleText.textContent = state.chillMode ? '中文 · Chill Mode' : '中文 · Touch Typing';
  }
  document.body.classList.toggle('chill-mode', state.chillMode);
}
function toggleChillMode() {
  state.chillMode = !state.chillMode;
  localStorage.setItem('ct-chill', state.chillMode ? '1' : '0');
  updateChillUI();
  applyCurrentHelpers();
}
function updateHidePinyinUI() {
  if (!$hidePinyinBtn) return;
  $hidePinyinBtn.classList.toggle('chill-active', state.hidePinyinInChill);
  $hidePinyinBtn.innerHTML = state.hidePinyinInChill ? ICON_EYE_OFF : ICON_EYE;
  $hidePinyinBtn.title = state.hidePinyinInChill
    ? 'Pinyin hidden — click to show it'
    : 'Hide pinyin (chill mode)';
}
function toggleHidePinyin() {
  state.hidePinyinInChill = !state.hidePinyinInChill;
  localStorage.setItem('ct-chill-hide-pinyin', state.hidePinyinInChill ? '1' : '0');
  updateHidePinyinUI();
  if (state.chillMode) applyCurrentHelpers();
}
// ===================== Traditional / Simplified =====================
const $traditionalBtn = document.getElementById('traditionalBtn');
function updateTraditionalUI() {
  if (!$traditionalBtn) return;
  // Button shows the OPPOSITE script — what you'll get if you click it.
  $traditionalBtn.textContent = state.traditional ? '简' : '繁';
  $traditionalBtn.title = state.traditional
    ? 'Switch to Simplified Chinese'
    : 'Switch to Traditional Chinese';
  $traditionalBtn.classList.toggle('traditional-active', state.traditional);
}
function toggleTraditional() {
  state.traditional = !state.traditional;
  localStorage.setItem('ct-traditional', state.traditional ? '1' : '0');
  updateTraditionalUI();
  if (state.current) renderCharacter();
}

function applyCurrentHelpers() {
  if (!state.current) return;
  if (state.chillMode) {
    state.currentHelpers = chillHelpers(state.current.t.length);
  } else {
    const s = state.perChar.get(state.current.h) || emptyStats();
    state.currentHelpers = getHelpers(s.progress, state.current.t.length);
  }
  renderCharacter();
  setExpectedKey();
}

function buildKeyboard() {
  const rows = [
    { letters: 'qwertyuiop', cls: 'r1' },
    { letters: 'asdfghjkl',  cls: 'r2' },
    { letters: 'zxcvbnm',    cls: 'r3' },
  ];
  rows.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row ' + row.cls;
    [...row.letters].forEach(letter => {
      const k = document.createElement('div');
      k.className = 'key';
      k.dataset.key = letter;
      k.id = 'key-' + letter;
      k.textContent = letter;
      // Letters that never appear in pinyin start dimmer
      if ('vyz'.indexOf(letter) === -1) {
        // most letters used; leave default
      }
      rowEl.appendChild(k);
    });
    $kb.appendChild(rowEl);
  });
}

function renderCharacter() {
  const c = state.current;
  $char.textContent = displayHanzi(c.h);
  $translation.textContent = c.en || '';

  const helpers  = state.currentHelpers;
  const stats    = state.perChar.get(c.h);
  const mastered = isMastered(stats, c.h);

  // Translation is the last text-helper to go (close to mastery).
  $playArea.classList.toggle('hide-translation', !helpers.showTranslation);
  renderStageDots(helpers, c.t.length, mastered);

  // Render pinyin letter-by-letter. The last `lettersHidden` letters from the
  // end are replaced with a dim dot — the user knows how many letters remain
  // but has to recall them. Typed (done) letters always show their real
  // character as visual confirmation of what was typed.
  $pinyin.innerHTML = '';
  const tone = detectTone(c.p);
  $pinyin.className = 'pinyin tone-' + tone;
  const pinyinChars = [...c.p];
  const total = pinyinChars.length;
  for (let i = 0; i < total; i++) {
    const span = document.createElement('span');
    span.className = 'letter';
    const isDone    = i < state.typedIndex;
    const isCurrent = i === state.typedIndex;
    const fromEnd   = total - 1 - i;
    const isHidden  = !isDone && fromEnd < helpers.lettersHidden;
    if (isDone) span.classList.add('done');
    else if (isCurrent) span.classList.add('current');
    if (isHidden) {
      span.classList.add('hidden-letter');
      span.textContent = '·';
    } else {
      span.textContent = pinyinChars[i];
    }
    $pinyin.appendChild(span);
  }
  updateProgress();
}

function updateProgress() {
  const c = state.current;
  const pct = c ? (state.typedIndex / c.t.length) * 100 : 0;
  $progress.style.width = pct + '%';
}

function renderPinyinProgress() {
  // Light re-render: update classes + reveal any previously-hidden letters
  // that have now been typed (so the user gets visual confirmation of what
  // their keypress was).
  const c = state.current;
  const pinyinChars = [...c.p];
  const total = pinyinChars.length;
  const helpers = state.currentHelpers;
  const spans = $pinyin.querySelectorAll('.letter');
  spans.forEach((sp, i) => {
    sp.classList.remove('done', 'current', 'hidden-letter');
    const isDone    = i < state.typedIndex;
    const isCurrent = i === state.typedIndex;
    const fromEnd   = total - 1 - i;
    const isHidden  = !isDone && fromEnd < helpers.lettersHidden;
    if (isDone) sp.classList.add('done');
    else if (isCurrent) sp.classList.add('current');
    if (isHidden) {
      sp.classList.add('hidden-letter');
      sp.textContent = '·';
    } else {
      sp.textContent = pinyinChars[i];
    }
  });
  updateProgress();
}

function setExpectedKey() {
  document.querySelectorAll('.key.expected').forEach(k => k.classList.remove('expected'));
  if (state.awaitingAdvance) return;
  // Keyboard "next key" hint is the first helper to disappear (otherwise it
  // would spell each letter for the user). The keyboard still shows the keys
  // you press — it just stops cueing the next correct one.
  if (!state.currentHelpers || !state.currentHelpers.showKbdHint) return;
  const c = state.current;
  if (!c) return;
  const next = c.t[state.typedIndex];
  if (!next) return;
  const el = document.getElementById('key-' + next);
  if (el) el.classList.add('expected');
}

function updatePressedKeys() {
  document.querySelectorAll('.key.pressed').forEach(k => k.classList.remove('pressed'));
  state.pressedKeys.forEach(k => {
    const el = document.getElementById('key-' + k);
    if (el) el.classList.add('pressed');
  });
}

function flashKey(letter, cls, ms = 200) {
  const el = document.getElementById('key-' + letter);
  if (!el) return;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

function flashChar(cls, ms = 320) {
  $char.classList.add(cls);
  setTimeout(() => $char.classList.remove(cls), ms);
}

function updateStatsDisplay(opts = {}) {
  const totalKeys = state.keysCorrect + state.keysWrong;
  const acc = totalKeys > 0 ? Math.round((state.keysCorrect / totalKeys) * 100) : 100;
  $accuracy.textContent = acc + '%';
  $streak.textContent = state.streak;
  $score.textContent = state.score;

  if (state.startTime) {
    const minutes = (Date.now() - state.startTime) / 60000;
    const cpm = minutes > 0 ? Math.round(state.charsCompleted / minutes) : 0;
    $cpm.textContent = cpm;
  } else {
    $cpm.textContent = '0';
  }

  if (opts.scoreDelta) {
    const cls = opts.scoreDelta > 0 ? 'flash-up' : 'flash-down';
    $score.classList.add(cls);
    setTimeout(() => $score.classList.remove(cls), 200);
  }
}

// ===================== Game flow =====================
function nextCharacter() {
  state.current = pickNext();
  state.typedIndex = 0;
  state.awaitingAdvance = false;
  state.recentChars.push(state.current.h);
  if (state.recentChars.length > 10) state.recentChars.shift();

  // Ensure stats exist & reset per-attempt mistake counter
  const s = state.perChar.get(state.current.h) || emptyStats();
  s.mistakesThisAttempt = 0;
  state.perChar.set(state.current.h, s);

  // Compute which helpers apply. Chill mode keeps everything on (except
  // pinyin, optionally, if the hide-pinyin toggle is enabled).
  state.currentHelpers = state.chillMode
    ? chillHelpers(state.current.t.length)
    : getHelpers(s.progress, state.current.t.length);

  renderCharacter();
  setExpectedKey();

  // Sound auto-plays only while it's still a helper. Once removed, Space
  // still replays on demand for the player who wants a manual hint.
  if (state.currentHelpers.autoSound) {
    speak(state.current.h);
  }
}

function completeCharacter() {
  state.charsCompleted++;

  const s        = state.perChar.get(state.current.h);
  const cleanRun = (s.mistakesThisAttempt || 0) === 0;

  // Streak is a session feedback signal — it works in both modes.
  if (cleanRun) state.streak++; else state.streak = 0;

  // ---- Chill mode: visual feedback only, no persistence / mastery / achievements.
  if (state.chillMode) {
    const delta = 5 + (cleanRun ? Math.min(state.streak, 30) : 0);
    state.score += delta;
    flashChar('correct');
    updateStatsDisplay({ scoreDelta: delta });
    state.awaitingAdvance = true;
    setExpectedKey();
    setTimeout(() => {
      nextCharacter();
      updateStatsDisplay();
    }, 240);
    return;
  }

  // ---- Practice mode (mastery flow).
  state.lifetime.totalChars++;
  saveLifetime();
  s.attempts++;

  const masteryAt          = getMasteryAt(state.current.t.length);
  const wasMastered        = isMastered(s, state.current.h);
  const everMasteredBefore = !!s.everMastered;

  if (cleanRun) {
    // Clean run advances progress (capped at this character's mastery point).
    s.progress = Math.min((s.progress || 0) + 1, masteryAt);
  } else {
    // Any mistake during this attempt rolls progress back one step, so a
    // hint that had been removed may reappear next time. Also un-masters a
    // character if the user fumbles a "mastered" review.
    s.progress = Math.max((s.progress || 0) - 1, 0);
  }

  const nowMastered  = isMastered(s, state.current.h);
  const justMastered = !wasMastered && nowMastered;
  const lostMastery  =  wasMastered && !nowMastered;
  if (nowMastered) s.everMastered = true;

  state.perChar.set(state.current.h, s);
  savePerChar();

  const bonus = cleanRun ? Math.min(state.streak, 30) : 0;
  let delta = 10 + bonus + (justMastered ? 100 : 0);
  state.score += delta;

  if (justMastered) {
    $char.classList.add('mastered-flash');
    setTimeout(() => $char.classList.remove('mastered-flash'), 700);
    updateMasteredDisplay({ gold: true });
    // Re-mastering a character that had previously been mastered → Comeback Kid.
    if (everMasteredBefore) unlockAchievement('comeback');
  } else {
    flashChar('correct');
    if (lostMastery) updateMasteredDisplay();
  }
  updateStatsDisplay({ scoreDelta: delta });
  checkPassiveAchievements();

  state.awaitingAdvance = true;
  setExpectedKey(); // clears expected during the brief pause
  setTimeout(() => {
    nextCharacter();
    updateStatsDisplay();
  }, justMastered ? 700 : 240);
}

function handleLetter(letter) {
  if (state.awaitingAdvance) return;
  if (!state.startTime) state.startTime = Date.now();

  const c = state.current;
  const expected = c.t[state.typedIndex];

  if (letter === expected) {
    state.keysCorrect++;
    state.consecutiveWrongKeys = 0;
    flashKey(letter, 'correct-flash', 160);
    state.typedIndex++;
    if (state.typedIndex >= c.t.length) {
      completeCharacter();
    } else {
      renderPinyinProgress();
      setExpectedKey();
      updateStatsDisplay();
    }
  } else {
    state.keysWrong++;
    state.consecutiveWrongKeys++;
    const s = state.perChar.get(c.h) || emptyStats();
    s.mistakesThisAttempt = (s.mistakesThisAttempt || 0) + 1;
    state.perChar.set(c.h, s);
    if (!state.chillMode) {
      // Practice mode: errors and persistence count; chill mode skips this.
      s.errors++;
      savePerChar();
    }
    state.score = Math.max(0, state.score - 1);
    flashKey(letter, 'wrong-flash', 200);
    flashChar('wrong');
    updateStatsDisplay({ scoreDelta: -1 });
    if (!state.chillMode) checkPassiveAchievements();
  }
}

// ===================== Input handling =====================
function onKeyDown(e) {
  if (e.key === 'Escape') {
    if (e.shiftKey) {
      clearAllProgress();
    } else {
      resetGame();
    }
    return;
  }
  if (e.key === '`') {
    toggleMute();
    e.preventDefault();
    return;
  }
  if (e.key === ' ' || e.code === 'Space') {
    replayCurrent();
    e.preventDefault();
    return;
  }
  if (e.repeat) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (!/^[a-z]$/.test(key)) return;
  e.preventDefault();

  state.pressedKeys.add(key);
  updatePressedKeys();
  handleLetter(key);
}
function onKeyUp(e) {
  const key = e.key.toLowerCase();
  if (state.pressedKeys.has(key)) {
    state.pressedKeys.delete(key);
    updatePressedKeys();
  }
}
function onBlur() {
  state.pressedKeys.clear();
  updatePressedKeys();
}

// ===================== Reset =====================
// Esc — soft reset of the current session. Mastery progress is preserved.
function resetGame() {
  state.typedIndex = 0;
  state.pressedKeys.clear();
  state.awaitingAdvance = false;
  state.startTime = null;
  state.charsCompleted = 0;
  state.keysCorrect = 0;
  state.keysWrong = 0;
  state.streak = 0;
  state.score = 0;
  state.recentChars = [];
  // Clear only the transient per-attempt mistake counter on stored stats
  state.perChar.forEach(v => { v.mistakesThisAttempt = 0; });
  updatePressedKeys();
  nextCharacter();
  updateStatsDisplay();
  updateMasteredDisplay();
}

// Shift+Esc — wipe all learned progress (mastery, achievements, lifetime).
function clearAllProgress() {
  state.perChar.clear();
  state.achievements.clear();
  state.lifetime = { totalChars: 0 };
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(ACH_KEY);
    localStorage.removeItem(LIFE_KEY);
  } catch {}
  renderAchievementsSidebar();
  resetGame();
}

// ===================== Init =====================
buildKeyboard();
buildCurriculumOptions();
updateMuteUI();
updateChillUI();
updateHidePinyinUI();
updateTraditionalUI();
updateMasteredDisplay();
renderAchievementsSidebar();
// Retroactively unlock any mastery / volume achievements based on loaded state.
// Silent so the user isn't toast-bombed on app open.
checkPassiveAchievements(true);
nextCharacter();
updateStatsDisplay();

$muteBtn.addEventListener('click', toggleMute);
$chillBtn.addEventListener('click', toggleChillMode);
$hidePinyinBtn.addEventListener('click', toggleHidePinyin);
$traditionalBtn.addEventListener('click', toggleTraditional);
$curriculumSelect.addEventListener('change', onCurriculumChange);
$char.addEventListener('click', replayCurrent);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', onBlur);

// Refresh CPM every 500ms so it ticks live
setInterval(() => {
  if (state.startTime) updateStatsDisplay();
}, 500);
</script>
</body>
</html>
